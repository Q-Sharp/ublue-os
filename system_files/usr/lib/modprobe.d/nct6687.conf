# force=true: Chip auch dann anbinden, wenn die ID-Pruefung nicht greift.
#
# msi_fan_brute_force=1: MSI-Boards (hier MAG B850 TOMAHAWK MAX WIFI, MS-7E62)
# benutzen fuer die SYS_FAN-Header abweichende Steuerregister. Der Treiber
# betritt den passenden Schreibpfad (nct6687_uses_msi_fan_curve) nur, wenn
# fan_config=msi_alt1 aktiv ist UND dieser Parameter gesetzt wurde - sonst
# lehnt der Super-I/O jeden PWM-Schreibvorgang ab ("The device rejected new
# configuration as invalid") und die Gehaeuseluefter bleiben ungeregelt.
# CPU_FAN und PUMP_FAN sind nicht betroffen (Index < 2).
options nct6687 force=true msi_fan_brute_force=1
